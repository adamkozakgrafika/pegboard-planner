<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modular Pegboard 4.0 Planner</title>
<meta name="description" content="Plan your Skadis modular pegboard 4.0: pick the size, get the module layout and the exact print list with plate numbers.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#f1f2f3;--surface:#e7e8ea;--ink:#16171b;--muted:#55585f;--line:#cfd1d5;--brand:#f8b133;--ink-on-brand:#16171b;--night:#0e0f12;--night-ink:#f2f2f0}
*{box-sizing:border-box;border-radius:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 "Montserrat",system-ui,sans-serif;
  background-image:radial-gradient(rgba(14,15,18,.2) 1px,transparent 1.3px);background-size:30px 30px}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.wrap{max-width:1360px;margin:0 auto;padding:0 clamp(16px,5.5vw,80px)}
.mono{font:500 12px/1.4 "DM Mono",ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase}
header{border-bottom:1px solid var(--line);background:var(--bg)}
header .wrap{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-top:14px;padding-bottom:14px;flex-wrap:wrap}
header .brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.02em}
header .brand i{width:14px;height:14px;background:var(--brand);display:inline-block}
header a{color:var(--ink);text-decoration:none;box-shadow:inset 0 -2px 0 var(--brand)}
.hero{padding:44px 0 26px}
h1{margin:6px 0 10px;font-weight:700;font-size:clamp(34px,5.4vw,64px);line-height:1.05;letter-spacing:-.045em}
h1 em{font-style:normal;box-shadow:inset 0 -.14em var(--brand)}
.lead{max-width:680px;color:var(--muted);margin:0}
.panel{border:1px solid var(--line);background:rgba(241,242,243,.92)}
.panel>h2{margin:0;padding:12px 16px;border-bottom:1px solid var(--line)}
.panel .body{padding:16px}
.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:0}
.ctl{padding:16px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.ctl>.mono{display:block;margin-bottom:10px;color:var(--muted)}
.row{display:flex;gap:10px;align-items:center}
input[type=range]{flex:1;accent-color:var(--brand)}
input[type=number]{width:70px;padding:7px 8px;border:1px solid var(--ink);background:transparent;font:500 14px "DM Mono",monospace;color:var(--ink)}
input[type=number].mm{width:84px}
.seg{display:inline-flex;border:1px solid var(--ink)}
.seg button{border:0;background:transparent;padding:8px 13px;font:600 12.5px "Montserrat",sans-serif;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;color:var(--ink);position:relative}
.seg button+button{border-left:1px solid var(--ink)}
.seg button:hover:not(.on){box-shadow:inset 0 -3px var(--brand)}
.seg button.on{background:var(--ink);color:var(--bg)}
.seg button:disabled{opacity:.3;cursor:not-allowed}
#lrseg,#tbseg{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--ink);width:100%;max-width:230px}
#lrseg button,#tbseg button{white-space:nowrap;padding:8px 6px;letter-spacing:.06em;background:var(--bg);border:0!important}
#lrseg button.on,#tbseg button.on{background:var(--ink)}
.hint{font-size:12.5px;color:var(--muted);margin-top:8px}
.main{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(330px,1fr);gap:12px;margin-top:12px}
@media(max-width:1000px){.main{grid-template-columns:1fr}}
.boardwrap{background:var(--surface);padding:12px;overflow:auto}
svg#board{display:block;width:100%;height:auto;max-height:78vh}
.piece path.body{transition:fill .12s}
.piece.hl path.body{fill:var(--muted)!important}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:12px;color:var(--muted)}
.legend i{display:inline-block;width:11px;height:11px;margin-right:6px;vertical-align:-1px}
.totals{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);margin-bottom:14px}
.totals div{padding:10px 12px;border-right:1px solid var(--line)}
.totals div:last-child{border-right:0}
.totals b{display:block;font-size:30px;font-weight:700;letter-spacing:-.04em;line-height:1.1}
.totals span{color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font:500 11.5px "DM Mono",monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--ink)}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tr.r.hl td{background:var(--surface)}
tr.r.hl td:first-child{box-shadow:inset 3px 0 var(--brand)}
td.q{font:500 14px "DM Mono",monospace;white-space:nowrap}
td.pl{font:500 13px "DM Mono",monospace;white-space:nowrap}
.sub{display:block;font-size:12.5px;color:var(--muted)}
.warn{border:1px solid var(--ink);background:var(--brand);color:var(--ink-on-brand);padding:10px 12px;margin-bottom:14px;font-size:14px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.btn{position:relative;overflow:hidden;border:1px solid var(--ink);background:transparent;color:var(--ink);padding:10px 16px;font:600 12.5px "Montserrat",sans-serif;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;isolation:isolate}
.btn::before{content:"";position:absolute;inset:0;background:var(--brand);transform:scaleX(0);transform-origin:left;transition:transform .25s ease;z-index:-1}
.btn:hover::before{transform:scaleX(1)}
.btn.fill{background:var(--ink);color:var(--bg)}
.btn.fill:hover{color:var(--ink-on-brand)}
.how{margin:16px 0 0;padding-left:18px;color:var(--muted);font-size:13.5px}
footer{margin-top:40px;border-top:1px solid var(--line);padding:18px 0 40px;color:var(--muted)}
footer a{color:var(--ink);box-shadow:inset 0 -2px var(--brand);text-decoration:none}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="brand"><i></i>adamkozakgrafika</div>
  <a class="mono" href="https://makerworld.com/en/@adamkozak" target="_blank" rel="noopener">MakerWorld · @adamkozak</a>
</div></header>

<div class="wrap">
  <div class="hero">
    <h1>Pegboard <em>Planner</em></h1>
  </div>

  <section class="panel">
    <h2 class="mono">(Board · settings)</h2>
    <div class="controls">
      <div class="ctl">
        <span class="mono">Board width (mm)</span>
        <div class="row"><input type="range" id="wr" min="80" max="1280" step="20"><input type="number" class="mm" id="w" min="80" max="1280" step="20"></div>
      </div>
      <div class="ctl">
        <span class="mono">Board height (mm)</span>
        <div class="row"><input type="range" id="hr" min="80" max="1280" step="20"><input type="number" class="mm" id="h" min="80" max="1280" step="20"></div>
      </div>
      <div class="ctl">
        <span class="mono">Rim</span>
        <div class="seg" id="rimseg"><button data-v="1">Rim + corners</button><button data-v="0">No rim</button></div>
      </div>
      <div class="ctl" id="lrctl">
        <span class="mono">Rim depth · left | right</span>
        <div class="seg" id="lrseg"></div>
      </div>
      <div class="ctl" id="tbctl">
        <span class="mono">Rim depth · top | bottom</span>
        <div class="seg" id="tbseg"></div>
      </div>
      <div class="ctl">
        <span class="mono">Material (file name)</span>
        <div class="seg" id="matseg"><button data-v="pla">PLA</button><button data-v="petg">PETG</button></div>
        <div class="hint" id="sizeinfo"></div>
      </div>
    </div>
  </section>

  <div class="main">
    <section class="panel">
      <h2 class="mono">(Layout · front view)</h2>
      <div class="body">
        <div class="boardwrap"><svg id="board" xmlns="http://www.w3.org/2000/svg"></svg></div>
      </div>
    </section>

    <section class="panel">
      <h2 class="mono">(Print · list)</h2>
      <div class="body">
        <div id="warn"></div>
        <div class="totals" id="totals"></div>
        <table>
          <thead><tr><th>Part</th><th>Qty</th><th>Plate</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
        <div class="btns">
          <button class="btn fill" id="copylink">Copy link</button>
          <button class="btn" id="dl">Download list</button>
        </div>
      </div>
    </section>
  </div>
</div>

var CONN_PER_PLATE=25;
var st={w:360,h:280,rim:1,lr:'40-40',tb:'40-40',mat:'pla'};

function tile1D(n){
  if(n<=0) return [];
  var best=[0],from=[0];
  for(var i=1;i<=n;i++){best[i]=Infinity;
    for(var l=1;l<=4&&l<=i;l++){var c=best[i-l]+1+0.001*l*l;if(c<best[i]){best[i]=c;from[i]=l;}}}
  var out=[],k=n;while(k>0){out.push(from[k]);k-=from[k];}
  return out.sort(function(a,b){return b-a});
}
function tile2D(W,H){
  var f=[],ch=[];
  for(var w=0;w<=W;w++){f[w]=[];ch[w]=[];for(var h=0;h<=H;h++){f[w][h]=0;ch[w][h]=null;}}
  for(var w2=1;w2<=W;w2++)for(var h2=1;h2<=H;h2++){
    var best=Infinity,c=null;
    if(w2<=4&&h2<=4){best=1+0.0001*w2*h2*w2*h2;c=['t'];}
    for(var s=1;s<=w2/2;s++){var v=f[s][h2]+f[w2-s][h2];if(v<best-1e-9){best=v;c=['v',s];}}
    for(var s2=1;s2<=h2/2;s2++){var v2=f[w2][s2]+f[w2][h2-s2];if(v2<best-1e-9){best=v2;c=['h',s2];}}
    f[w2][h2]=best;ch[w2][h2]=c;
  }
  var out=[];
  (function rec(x,y,w,h){var c=ch[w][h];
    if(c[0]==='t')out.push({x:x,y:y,w:w,h:h});
    else if(c[0]==='v'){rec(x,y,c[1],h);rec(x+c[1],y,w-c[1],h);}
    else{rec(x,y,w,c[1]);rec(x,y+c[1],w,h-c[1]);}
  })(0,0,W,H);
  return out;
}

/* ---------- plan ---------- */
function dims(){
  var rim=st.rim,lr=st.lr.split('-'),tb=st.tb.split('-');
  var l=rim?+lr[0]:0,r=rim?+lr[1]:0,t=rim?+tb[0]:0,b=rim?+tb[1]:0;
  return {l:l,r:r,t:t,b:b,nx:Math.round((st.w-l-r)/U),ny:Math.round((st.h-t-b)/U)};
}
function plan(){
  var D=dims(),nx=D.nx,ny=D.ny,rim=st.rim,l=D.l,r=D.r,t=D.t,b=D.b;
  var W=st.w,H=st.h;
  var pieces=[];
  var ox=rim?1:0,EX=nx+2*ox,EY=ny+2*ox;
  var grid=[];for(var i=0;i<EX;i++){grid[i]=[];}
  function colX(e){return rim?(e===0?0:(e===nx+1?l+U*nx:l+U*(e-1))):U*e}
  function colW(e){return rim?(e===0?l:(e===nx+1?r:U)):U}
  function rowY(e){return rim?(e===0?0:(e===ny+1?b+U*ny:b+U*(e-1))):U*e}
  function rowH(e){return rim?(e===0?b:(e===ny+1?t:U)):U}
  function add(p,ex,ey,ew,eh){
    p.id=pieces.length;p.x=colX(ex);p.y=rowY(ey);
    var w=0,h=0,a,c;for(a=0;a<ew;a++)w+=colW(ex+a);for(c=0;c<eh;c++)h+=rowH(ey+c);
    p.w=w;p.h=h;pieces.push(p);
    for(a=0;a<ew;a++)for(c=0;c<eh;c++)grid[ex+a][ey+c]=p.id;
  }
  if(rim){
    [[0,0,false,false,l,b],[nx+1,0,true,false,r,b],[0,ny+1,false,true,l,t],[nx+1,ny+1,true,true,r,t]].forEach(function(c){
      var tx=c[4],ty=c[5];
      var key=(tx===40&&ty===40)?'c40':(tx===20&&ty===20)?'c20':'cad';
      var base=(key==='cad'&&tx===20)?'tr':'n'; /* adapter file is 40 wide x 20 tall; transposed when the box is 20 wide x 40 tall */
      add({type:'corner',key:key,v:{base:base,mx:c[2],my:c[3]}},c[0],c[1],1,1);
    });
    var hs=tile1D(nx),vs=tile1D(ny);
    [[0,b,'n'],[ny+1,t,'r180']].forEach(function(s){var e=1;hs.forEach(function(len){add({type:'border',key:'b'+s[1]+'_'+len,v:{base:s[2]}},e,s[0],len,1);e+=len;});});
    [[0,l,'r270'],[nx+1,r,'r90']].forEach(function(s){var e=1;vs.forEach(function(len){add({type:'border',key:'b'+s[1]+'_'+len,v:{base:s[2]}},s[0],e,1,len);e+=len;});});
  }
  tile2D(nx,ny).forEach(function(rc){
    var a=Math.min(rc.w,rc.h),c=Math.max(rc.w,rc.h);
    add({type:'mid',key:'m'+a+'x'+c,v:{base:rc.w>=rc.h?'n':'r90'}},rc.x+ox,rc.y+ox,rc.w,rc.h);
  });
  var conns=[];
  var i0=rim?0:1,i1=rim?nx:nx-1,j0=rim?0:1,j1=rim?ny:ny-1;
  for(var i2=i0;i2<=i1;i2++)for(var j2=j0;j2<=j1;j2++){
    var ids={},cnt=0;
    [[i2,j2],[i2+1,j2],[i2,j2+1],[i2+1,j2+1]].forEach(function(c){
      var ex=rim?c[0]:c[0]-1,ey=rim?c[1]:c[1]-1;
      if(ex<0||ey<0||ex>=EX||ey>=EY)return;
      var id=grid[ex][ey];if(id!==undefined&&!ids[id]){ids[id]=1;cnt++;}
    });
    if(cnt>=2)conns.push({x:l+U*i2,y:b+U*j2});
  }
  return {pieces:pieces,conns:conns,W:W,H:H,nx:nx,ny:ny};
}

/* ---------- labels ---------- */
function label(k){
  var m;
  if(k==='conn')return 'Connectors';
  if(k==='c40')return 'Corner modules';
  if(k==='c20')return 'Mini corner modules';
  if(k==='cad')return 'Adapter corner modules';
  if((m=/^b(\d+)_(\d)$/.exec(k)))return (m[1]==='20'?'Mini border ':'Border ')+(m[2]*40)+' mm <span class="sub">'+(m[1]==='20'?'20':'40')+' mm deep</span>';
  if((m=/^m(\d)x(\d)$/.exec(k)))return 'Mid module '+(m[1]*40)+' × '+(m[2]*40)+' mm';
  return k;
}
function plain(k){return label(k).replace(/<span class="sub">/g,'(').replace(/<\/span>/g,')').replace(/<[^>]+>/g,'')}
function fname(){return 'Skadis_modular_4.0_mini_'+st.mat+'.3mf'}

/* ---------- render ---------- */
var svg=document.getElementById('board');
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function matrixFor(p,sh,H,pad){
  var w0=sh.w,h0=sh.h,v=p.v,m,bw,bh;
  switch(v.base){
    case 'n':m=[1,0,0,1,0,0];bw=w0;bh=h0;break;
    case 'r180':m=[-1,0,0,-1,w0,h0];bw=w0;bh=h0;break;
    case 'r90':m=[0,1,-1,0,h0,0];bw=h0;bh=w0;break;
    case 'r270':m=[0,-1,1,0,0,w0];bw=h0;bh=w0;break;
    case 'tr':m=[0,1,1,0,0,0];bw=h0;bh=w0;break;
  }
  if(v.mx){m=[-m[0],m[1],-m[2],m[3],bw-m[4],m[5]];}
  if(v.my){m=[m[0],-m[1],m[2],-m[3],m[4],bh-m[5]];}
  /* board mm (y up) -> svg: translate by piece origin, flip y */
  var e=m[4]+p.x,f=m[5]+p.y;
  return 'matrix('+m[0]+' '+(-m[1])+' '+m[2]+' '+(-m[3])+' '+(pad+e)+' '+(pad+H-f)+')';
}
function render(){
  var P=plan(),pad=10,W=P.W,H=P.H;
  svg.setAttribute('viewBox','0 0 '+(W+pad*2)+' '+(H+pad*2));
  var out='<rect x="'+pad+'" y="'+pad+'" width="'+W+'" height="'+H+'" fill="#d6d8db"/>';
  P.pieces.forEach(function(p){
    var sh=SH[p.key];
    var fill='#16171b';
    out+='<g class="piece" data-k="'+p.key+'"><path class="body" transform="'+matrixFor(p,sh,H,pad)+'" d="'+sh.d+'" fill="'+fill+'" fill-rule="evenodd" stroke="#e7e8ea" stroke-width=".5"/>'+
      '<title>'+esc(plain(p.key))+'</title></g>';
  });
  P.conns.forEach(function(c){
    out+='<path pointer-events="none" transform="translate('+(pad+c.x)+','+(pad+H-c.y)+') scale(1,-1)" d="'+SH.conn.d+'" fill="#f8b133" fill-rule="evenodd"/>';
  });
  svg.innerHTML=out;

  var cnt={},order=[];
  P.pieces.forEach(function(p){if(!cnt[p.key]){cnt[p.key]=0;order.push(p.key);}cnt[p.key]++;});
  var rows=[];
  if(P.conns.length)rows.push({k:'conn',qty:Math.ceil(P.conns.length/CONN_PER_PLATE),p:SH.conn.p,extra:P.conns.length+' needed · '+CONN_PER_PLATE+' per plate'});
  ['c40','c20','cad'].forEach(function(k){if(cnt[k])rows.push({k:k,qty:1,p:SH[k].p,extra:cnt[k]+' needed · 4 per plate'});});
  var rest=order.filter(function(k){return k.charAt(0)!=='c'}).map(function(k){return{k:k,qty:cnt[k],p:SH[k].p}});
  rest.sort(function(a,b){return a.p-b.p});
  rows=rows.concat(rest);
  document.getElementById('rows').innerHTML=rows.map(function(r){
    return '<tr class="r" data-k="'+r.k+'"><td>'+label(r.k)+(r.extra?'<span class="sub">'+r.extra+'</span>':'')+'</td><td class="q">×'+r.qty+'</td><td class="pl">plate '+r.p+'</td></tr>';
  }).join('');
  var plates=rows.reduce(function(s,r){return s+r.qty},0);
  document.getElementById('totals').innerHTML=
    '<div><b>'+P.pieces.length+'</b><span class="mono">modules</span></div>'+
    '<div><b>'+P.conns.length+'</b><span class="mono">connectors</span></div>'+
    '<div><b>'+plates+'</b><span class="mono">plates to print</span></div>';
  document.getElementById('sizeinfo').innerHTML='Board: <b>'+W+' × '+H+' mm</b><br>File: '+fname();
  P.rows=rows;window.__plan=P;
  wire();
}
function wire(){
  function set(k,on){document.querySelectorAll('[data-k="'+k+'"]').forEach(function(e){e.classList.toggle('hl',on)})}
  document.querySelectorAll('.piece,tr.r').forEach(function(e){
    e.addEventListener('mouseenter',function(){set(e.dataset.k,true)});
    e.addEventListener('mouseleave',function(){set(e.dataset.k,false)});
  });
}

/* ---------- ui ---------- */
var OPTS=['40-40','20-20','40-20','20-40'];
function snapSize(v){var step=st.rim?20:40;v=Math.round((+v||0)/step)*step;return Math.max(st.rim?80:40,Math.min(1280,v))}
function validOpt(o,size){var p=o.split('-');var inner=size-(+p[0])-(+p[1]);return inner>=U&&inner%U===0}
function fix(){
  st.w=snapSize(st.w);st.h=snapSize(st.h);
  if(!st.rim)return;
  [['lr','w'],['tb','h']].forEach(function(a){
    if(validOpt(st[a[0]],st[a[1]]))return;
    for(var i=0;i<OPTS.length;i++){if(validOpt(OPTS[i],st[a[1]])){st[a[0]]=OPTS[i];return;}}
    st[a[1]]=80;st[a[0]]='20-20';
  });
}
function buildSeg(id,key,sizeKey){
  var el=document.getElementById(id);
  el.innerHTML=OPTS.map(function(o){
    var ok=st.rim&&validOpt(o,st[sizeKey]);
    return '<button data-v="'+o+'"'+(ok?'':' disabled')+(o===st[key]?' class="on"':'')+'>'+o.replace('-',' · ')+'</button>';
  }).join('');
  el.querySelectorAll('button').forEach(function(b){
    b.addEventListener('click',function(){st[key]=b.dataset.v;sync();});
  });
}
function sync(){
  fix();
  document.getElementById('w').value=st.w;document.getElementById('wr').value=st.w;
  document.getElementById('h').value=st.h;document.getElementById('hr').value=st.h;
  var step=st.rim?20:40;
  ['w','wr','h','hr'].forEach(function(id){document.getElementById(id).step=step});
  buildSeg('lrseg','lr','w');buildSeg('tbseg','tb','h');
  document.getElementById('lrctl').style.opacity=document.getElementById('tbctl').style.opacity=st.rim?1:.4;
  ['rim','mat'].forEach(function(k){
    document.querySelectorAll('#'+k+'seg button').forEach(function(b){b.classList.toggle('on',b.dataset.v===String(st[k]))});
  });
  try{history.replaceState(null,'','#w='+st.w+'&h='+st.h+'&rim='+st.rim+'&lr='+st.lr+'&tb='+st.tb+'&mat='+st.mat)}catch(e){}
  var D=dims();
  render();
}
[['w','w'],['wr','w'],['h','h'],['hr','h']].forEach(function(a){
  document.getElementById(a[0]).addEventListener('input',function(e){st[a[1]]=+e.target.value;sync();});
});
['rim','mat'].forEach(function(k){
  document.querySelectorAll('#'+k+'seg button').forEach(function(b){
    b.addEventListener('click',function(){var v=b.dataset.v;st[k]=(k==='mat')?v:+v;sync();});
  });
});
document.getElementById('copylink').addEventListener('click',function(){
  var btn=this,url=location.href;
  function done(){var x=btn.textContent;btn.textContent='Copied';setTimeout(function(){btn.textContent=x},1400)}
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(url).then(done,function(){prompt('Copy this link:',url)});
  else prompt('Copy this link:',url);
});
document.getElementById('dl').addEventListener('click',function(){
  var P=window.__plan,L=['Skadis modular pegboard 4.0 - '+P.W+' x '+P.H+' mm, '+st.mat.toUpperCase(),'File: '+fname(),''];
  P.rows.forEach(function(r){L.push('x'+r.qty+'  '+plain(r.k)+'  -  plate '+r.p+(r.extra?'  ('+r.extra+')':''))});
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([L.join('\n')+'\n'],{type:'text/plain'}));
  a.download='pegboard_4.0_print_list_'+P.W+'x'+P.H+'.txt';a.click();setTimeout(function(){URL.revokeObjectURL(a.href)},1000);
});
location.hash.replace(/^#/,'').split('&').forEach(function(kv){
  var p=kv.split('=');if(p.length!==2)return;
  if(p[0]==='w')st.w=+p[1]||st.w;if(p[0]==='h')st.h=+p[1]||st.h;
  if(p[0]==='rim')st.rim=p[1]==='0'?0:1;
  if(p[0]==='lr'&&OPTS.indexOf(p[1])>=0)st.lr=p[1];
  if(p[0]==='tb'&&OPTS.indexOf(p[1])>=0)st.tb=p[1];
  if(p[0]==='mat'&&/^(pla|petg)$/.test(p[1]))st.mat=p[1];
});
sync();
})();
</script>
