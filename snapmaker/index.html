<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modular Pegboard Planner - Snapmaker edition</title>
<meta name="description" content="Plan your 5.2 mm modular pegboard (Snapmaker U1 profiles): pick the size, get the module layout and the exact print list with plate numbers.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#f1f2f3;--surface:#e7e8ea;--ink:#16171b;--muted:#55585f;--line:#cfd1d5;--brand:#f8b133;--ink-on-brand:#16171b;--night:#0e0f12;--night-ink:#f2f2f0}
*{box-sizing:border-box;border-radius:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 "Montserrat",system-ui,sans-serif;
  background-image:radial-gradient(rgba(14,15,18,.2) 1px,transparent 1.3px);background-size:30px 30px}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.wrap{max-width:1360px;margin:0 auto;padding:0 clamp(16px,5.5vw,80px)}
.mono{font:500 12px/1.4 "DM Mono",ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase}
header{border-bottom:1px solid var(--line);background:var(--bg)}
header .wrap{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-top:14px;padding-bottom:14px;flex-wrap:wrap}
header .brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.02em}
header .brand i{width:14px;height:14px;background:var(--brand);display:inline-block}
header a{color:var(--ink);text-decoration:none;box-shadow:inset 0 -2px 0 var(--brand)}
.hero{padding:44px 0 26px}
h1{margin:6px 0 10px;font-weight:700;font-size:clamp(34px,5.4vw,64px);line-height:1.05;letter-spacing:-.045em}
h1 em{font-style:normal;box-shadow:inset 0 -.14em var(--brand)}
.lead{max-width:680px;color:var(--muted);margin:0}
.panel{border:1px solid var(--line);background:rgba(241,242,243,.92)}
.panel>h2{margin:0;padding:12px 16px;border-bottom:1px solid var(--line)}
.panel .body{padding:16px}
.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:0}
.ctl{padding:16px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.ctl>.mono{display:block;margin-bottom:10px;color:var(--muted)}
.row{display:flex;gap:10px;align-items:center}
input[type=range]{flex:1;accent-color:var(--brand)}
input[type=number]{width:70px;padding:7px 8px;border:1px solid var(--ink);background:transparent;font:500 14px "DM Mono",monospace;color:var(--ink)}
input[type=number].mm{width:84px}
.seg{display:inline-flex;border:1px solid var(--ink)}
.seg button{border:0;background:transparent;padding:8px 13px;font:600 12.5px "Montserrat",sans-serif;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;color:var(--ink);position:relative}
.seg button+button{border-left:1px solid var(--ink)}
.seg button:hover:not(.on){box-shadow:inset 0 -3px var(--brand)}
.seg button.on{background:var(--ink);color:var(--bg)}
.hint{font-size:12.5px;color:var(--muted);margin-top:8px}
.main{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(330px,1fr);gap:12px;margin-top:12px}
@media(max-width:1000px){.main{grid-template-columns:1fr}}
.boardwrap{background:var(--surface);padding:12px;overflow:auto}
svg#board{display:block;width:100%;height:auto;max-height:78vh}
.piece path.body{transition:fill .12s}
.piece.hl path.body{fill:var(--muted)!important}
.tag{display:none}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:12px;color:var(--muted)}
.legend i{display:inline-block;width:11px;height:11px;margin-right:6px;vertical-align:-1px}
.totals{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);margin-bottom:14px}
.totals div{padding:10px 12px;border-right:1px solid var(--line)}
.totals div:last-child{border-right:0}
.totals b{display:block;font-size:30px;font-weight:700;letter-spacing:-.04em;line-height:1.1}
.totals span{color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font:500 11.5px "DM Mono",monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--ink)}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tr.r.hl td{background:var(--surface)}
tr.r.hl td:first-child{box-shadow:inset 3px 0 var(--brand)}
td.q{font:500 14px "DM Mono",monospace;white-space:nowrap}
td.pl{font:500 13px "DM Mono",monospace;white-space:nowrap}
.sub{display:block;font-size:12.5px;color:var(--muted)}
.warn{border:1px solid var(--ink);background:var(--brand);color:var(--ink-on-brand);padding:10px 12px;margin-bottom:14px;font-size:14px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.btn{position:relative;overflow:hidden;border:1px solid var(--ink);background:transparent;color:var(--ink);padding:10px 16px;font:600 12.5px "Montserrat",sans-serif;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;isolation:isolate}
.btn::before{content:"";position:absolute;inset:0;background:var(--brand);transform:scaleX(0);transform-origin:left;transition:transform .25s ease;z-index:-1}
.btn:hover::before{transform:scaleX(1)}
.btn.fill{background:var(--ink);color:var(--bg)}
.btn.fill:hover{color:var(--ink-on-brand)}
.how{margin:16px 0 0;padding-left:18px;color:var(--muted);font-size:13.5px}
footer{margin-top:40px;border-top:1px solid var(--line);padding:18px 0 40px;color:var(--muted)}
footer a{color:var(--ink);box-shadow:inset 0 -2px var(--brand);text-decoration:none}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="brand"><i></i>adamkozakgrafika</div>
  <a class="mono" href="https://makerworld.com/en/@adamkozak" target="_blank" rel="noopener">MakerWorld · @adamkozak</a>
</div></header>
<div class="wrap">
  <div class="hero">
    <h1>Pegboard <em>Planner</em></h1>
  </div>
  <section class="panel">
    <h2 class="mono">(Board · settings)</h2>
    <div class="controls">
      <div class="ctl"><span class="mono">Width (cells of 40 mm)</span>
        <div class="row"><input type="range" id="wr" min="2" max="40"><input type="number" id="w" min="2" max="40"></div></div>
      <div class="ctl"><span class="mono">Height (cells of 40 mm)</span>
        <div class="row"><input type="range" id="hr" min="2" max="40"><input type="number" id="h" min="2" max="40"></div></div>
      <div class="ctl"><span class="mono">Or the wall size in mm</span>
        <div class="row"><input type="number" class="mm" id="wmm" min="80" step="10"> × <input type="number" class="mm" id="hmm" min="80" step="10"> mm</div></div>
      <div class="ctl"><span class="mono">Sets you print</span>
        <div class="seg" id="setseg"><button data-v="S">S</button><button data-v="M">M</button><button data-v="SM">S + M</button></div></div>
      <div class="ctl"><span class="mono">Outer edge</span>
        <div class="seg" id="edgeseg"><button data-v="1">Rim + corners</button><button data-v="0">Plain</button></div></div>
      <div class="ctl"><span class="mono">Material (file name)</span>
        <div class="seg" id="matseg"><button data-v="pla">PLA</button><button data-v="petg">PETG</button></div>
        <div class="hint" id="sizeinfo"></div></div>
    </div>
  </section>
  <div class="main">
    <section class="panel"><h2 class="mono">(Layout · front view)</h2>
      <div class="body"><div class="boardwrap"><svg id="board" xmlns="http://www.w3.org/2000/svg"></svg></div>
      </div></section>
    <section class="panel"><h2 class="mono">(Print · list)</h2>
      <div class="body"><div id="warn"></div><div class="totals" id="totals"></div>
        <table><thead><tr><th>Part</th><th>Qty</th><th>File · plate</th></tr></thead><tbody id="rows"></tbody></table>
        <div class="btns"><button class="btn fill" id="copylink">Copy link</button><button class="btn" id="dl">Download list</button></div>
      </div></section>
  </div>
</div>

function sets(){return st.set==='SM'?['S','M']:[st.set]}
function find(key){ /* -> {f:'S'|'M', p:plate} or null; prefers S */
  var ss=sets();
  for(var i=0;i<ss.length;i++){var p=PL[ss[i]][key]; if(p) return {f:ss[i],p:p};}
  return null;
}
function has(key){return !!find(key)}

/* ---------- tiling ---------- */
function tile1D(n){ /* lengths of rim strips */
  if(n<=0) return [];
  var lens=[];
  for(var l=1;l<=6;l++){
    var ok = l===1 ? (has('e1x1b')&&has('e1x1l')) : (has('ev'+l)&&has('eh'+l));
    if(ok) lens.push(l);
  }
  var best=[0],from=[0];
  for(var i=1;i<=n;i++){
    best[i]=Infinity;
    for(var k=0;k<lens.length;k++){
      var l=lens[k]; if(l>i) continue;
      var c=best[i-l]+1+0.001*l*l;
      if(c<best[i]){best[i]=c;from[i]=l;}
    }
  }
  if(!isFinite(best[n])) return null;
  var out=[],i2=n; while(i2>0){out.push(from[i2]);i2-=from[i2];}
  return out.sort(function(a,b){return b-a});
}
function tile2D(W,H){ /* guillotine DP, min number of modules */
  if(W<=0||H<=0) return [];
  var avail={};
  for(var a=1;a<=6;a++)for(var b=1;b<=6;b++) avail[a+'x'+b]=has('m'+a+'x'+b);
  var f=[],ch=[];
  for(var w=0;w<=W;w++){f[w]=[];ch[w]=[];for(var h=0;h<=H;h++){f[w][h]=0;ch[w][h]=null;}}
  for(var w2=1;w2<=W;w2++)for(var h2=1;h2<=H;h2++){
    var best=Infinity,c=null;
    if(w2<=6&&h2<=6&&avail[w2+'x'+h2]){best=1+0.0001*w2*h2*w2*h2;c=['t'];}
    for(var s=1;s<=w2/2;s++){var v=f[s][h2]+f[w2-s][h2]; if(v<best-1e-9){best=v;c=['v',s];}}
    for(var s2=1;s2<=h2/2;s2++){var v2=f[w2][s2]+f[w2][h2-s2]; if(v2<best-1e-9){best=v2;c=['h',s2];}}
    f[w2][h2]=best;ch[w2][h2]=c;
  }
  if(!isFinite(f[W][H])) return null;
  var out=[];
  (function rec(x,y,w,h){
    var c=ch[w][h];
    if(c[0]==='t') out.push({x:x,y:y,w:w,h:h});
    else if(c[0]==='v'){rec(x,y,c[1],h);rec(x+c[1],y,w-c[1],h);}
    else {rec(x,y,w,c[1]);rec(x,y+c[1],w,h-c[1]);}
  })(0,0,W,H);
  return out;
}

/* ---------- plan ---------- */
function plan(){
  var W=st.w,H=st.h,pieces=[],errors=[];
  function add(p){p.id=pieces.length;pieces.push(p);}
  if(st.edge){
    var corners=[[0,0],[W-1,0],[0,H-1],[W-1,H-1]];
    corners.forEach(function(c){add({x:c[0],y:c[1],w:1,h:1,type:'corner',key:'corner'});});
    var hs=tile1D(W-2), vs=tile1D(H-2);
    if(hs===null) errors.push('The '+(W-2)+'-cell top/bottom sides cannot be made from the rim modules in set '+st.set+'.');
    if(vs===null) errors.push('The '+(H-2)+'-cell left/right sides cannot be made from the rim modules in set '+st.set+'.');
    if(hs) [0,H-1].forEach(function(y){
      var x=1; hs.forEach(function(l){add({x:x,y:y,w:l,h:1,type:'edge',key:l===1?'e1x1b':'eh'+l,side:y===0?'bottom':'top'});x+=l;});});
    if(vs) [0,W-1].forEach(function(x){
      var y=1; vs.forEach(function(l){add({x:x,y:y,w:1,h:l,type:'edge',key:l===1?'e1x1l':'ev'+l,side:x===0?'left':'right'});y+=l;});});
    var inner=tile2D(W-2,H-2);
    if(inner===null) errors.push('The '+(W-2)+'×'+(H-2)+' inner area cannot be tiled with the modules in set '+st.set+'.');
    else inner.forEach(function(r){add({x:r.x+1,y:r.y+1,w:r.w,h:r.h,type:'mod',key:'m'+r.w+'x'+r.h});});
  }else{
    var all=tile2D(W,H);
    if(all===null) errors.push('A '+W+'×'+H+' board cannot be tiled with the modules in set '+st.set+'.');
    else all.forEach(function(r){add({x:r.x,y:r.y,w:r.w,h:r.h,type:'mod',key:'m'+r.w+'x'+r.h});});
  }
  /* connectors = every 40 mm edge segment shared by two different pieces */
  var grid=[],i,j;
  for(i=0;i<W;i++){grid[i]=[];}
  pieces.forEach(function(p){for(var a=0;a<p.w;a++)for(var b=0;b<p.h;b++)grid[p.x+a][p.y+b]=p.id;});
  var conns=[];
  for(i=0;i<W;i++)for(j=0;j<H;j++){
    if(grid[i][j]===undefined) continue;
    if(i+1<W&&grid[i+1][j]!==undefined&&grid[i+1][j]!==grid[i][j]) conns.push({x:i+1,y:j+.5});
    if(j+1<H&&grid[i][j+1]!==undefined&&grid[i][j+1]!==grid[i][j]) conns.push({x:i+.5,y:j+1});
  }
  return {pieces:pieces,conns:conns,errors:errors};
}

/* ---------- labels ---------- */
function label(key){
  if(key==='corner') return 'Corner pieces <span class="sub">(all 4 on one plate)</span>';
  if(key==='conn') return 'Connectors';
  if(key==='e1x1b') return 'Rim module 1×1 <span class="sub">bottom / top side</span>';
  if(key==='e1x1l') return 'Rim module 1×1 <span class="sub">left / right side</span>';
  var m;
  if((m=/^ev(\d)$/.exec(key))) return 'Rim module 1×'+m[1]+' <span class="sub">left / right side</span>';
  if((m=/^eh(\d)$/.exec(key))) return 'Rim module '+m[1]+'×1 <span class="sub">bottom / top side</span>';
  if((m=/^m(\d)x(\d)$/.exec(key))) return 'Module '+m[1]+'×'+m[2];
  return key;
}
function plainLabel(key){return label(key).replace(/<[^>]+>/g,'')}
function fileName(f){return 'modular_pegboard_'+st.mat+'_'+f+'.3mf'}

/* ---------- render ---------- */
var svg=document.getElementById('board');
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function render(){
  var P=plan(),W=st.w,H=st.h,pad=8,c=CELL;
  var vw=W*c+pad*2, vh=H*c+pad*2;
  svg.setAttribute('viewBox','0 0 '+vw+' '+vh);
  var out='';
  out+='<rect x="'+pad+'" y="'+pad+'" width="'+W*c+'" height="'+H*c+'" fill="#d6d8db"/>';
  P.pieces.forEach(function(p){
    var X=pad+p.x*c, Y=pad+(H-p.y-p.h)*c, w=p.w*c, h=p.h*c;
    var fill='#16171b';
    var mode='n';
    if(p.type==='corner'){
      var right=p.x>0, top=p.y>0;
      mode=right&&top?'r':right?'mx':top?'my':'n';
    }else if(p.type==='edge'&&(p.side==='top'||p.side==='right')) mode='r';
    var tr={n:'translate('+X+','+(Y+h)+') scale(1,-1)',
            r:'translate('+(X+w)+','+Y+') scale(-1,1)',
            mx:'translate('+(X+w)+','+(Y+h)+') scale(-1,-1)',
            my:'translate('+X+','+Y+')'}[mode];
    out+='<g class="piece" data-k="'+p.key+'" data-id="'+p.id+'">';
    out+='<path class="body" transform="'+tr+'" d="'+SH[p.key].d+'" fill="'+fill+'" fill-rule="evenodd" stroke="#e7e8ea" stroke-width=".5"/>';
    out+='<title>'+esc(plainLabel(p.key))+(p.side?' ('+p.side+')':'')+'</title></g>';
  });
  P.conns.forEach(function(k){
    var cx=pad+k.x*c, cy=pad+(H-k.y)*c;
    out+='<path pointer-events="none" transform="translate('+cx+','+cy+') scale(1,-1)" d="'+SH.conn.d+'" fill="#f8b133" fill-rule="evenodd"/>';
  });
  svg.innerHTML=out;

  /* print list */
  var cnt={},order=[];
  P.pieces.forEach(function(p){if(!cnt[p.key]){cnt[p.key]=0;order.push(p.key);}cnt[p.key]++;});
  var rows=[];
  var needConn=P.conns.length;
  if(needConn){var f=find('conn');rows.push({key:'conn',qty:Math.ceil(needConn/CONN_PER_PLATE),f:f.f,p:f.p,extra:needConn+' connectors needed · '+CONN_PER_PLATE+' per plate'});}
  if(cnt.corner){var f2=find('corner');rows.push({key:'corner',qty:1,f:f2.f,p:f2.p,extra:'4 corners needed'});}
  order.forEach(function(k){
    if(k==='corner')return;
    var f=find(k); if(!f) return;
    rows.push({key:k,qty:cnt[k],f:f.f,p:f.p});
  });
  var rest=rows.filter(function(r){return r.key!=='conn'&&r.key!=='corner'});
  rest.sort(function(a,b){return a.f===b.f?a.p-b.p:(a.f<b.f?1:-1)}); /* S first, then M */
  rows=rows.filter(function(r){return r.key==='conn'||r.key==='corner'}).concat(rest);
  var html='';
  rows.forEach(function(r){
    html+='<tr class="r" data-k="'+r.key+'"><td>'+label(r.key)+(r.extra?'<span class="sub">'+r.extra+'</span>':'')+'</td>'+
      '<td class="q">×'+r.qty+'</td>'+
      '<td class="pl">'+r.f+' · plate '+r.p+'</td></tr>';
  });
  document.getElementById('rows').innerHTML=html;
  var nMods=P.pieces.length;
  var plates=rows.reduce(function(s,r){return s+r.qty},0);
  var usedSets={};rows.forEach(function(r){usedSets[r.f]=1});
  document.getElementById('totals').innerHTML=
    '<div><b>'+nMods+'</b><span class="mono">modules</span></div>'+
    '<div><b>'+needConn+'</b><span class="mono">connectors</span></div>'+
    '<div><b>'+plates+'</b><span class="mono">plates to print</span></div>';
  document.getElementById('warn').innerHTML=P.errors.length?
    '<div class="warn"><b>Can\'t build this size with set '+st.set+'.</b><br>'+P.errors.map(esc).join('<br>')+
    (st.set!=='SM'?'<br>Try “S + M” or another size.':'<br>Try another size or switch to plain modules.')+'</div>':'';
  document.getElementById('sizeinfo').innerHTML='Board: <b>'+(W*CELL)+' × '+(H*CELL)+' mm</b><br>Files: '+Object.keys(usedSets).map(fileName).join(', ');
  P.rows=rows;
  window.__plan=P;
  wireHover();
}

function wireHover(){
  function set(k,on){
    document.querySelectorAll('[data-k="'+k+'"]').forEach(function(e){e.classList.toggle('hl',on)});
  }
  document.querySelectorAll('.piece').forEach(function(e){
    e.addEventListener('mouseenter',function(){set(e.dataset.k,true)});
    e.addEventListener('mouseleave',function(){set(e.dataset.k,false)});
  });
  document.querySelectorAll('tr.r').forEach(function(e){
    e.addEventListener('mouseenter',function(){set(e.dataset.k,true)});
    e.addEventListener('mouseleave',function(){set(e.dataset.k,false)});
  });
}

/* ---------- ui ---------- */
function clamp(v){v=Math.round(+v);if(!isFinite(v))v=2;return Math.max(2,Math.min(40,v))}
function sync(){
  document.getElementById('w').value=st.w;document.getElementById('wr').value=st.w;
  document.getElementById('h').value=st.h;document.getElementById('hr').value=st.h;
  document.getElementById('wmm').value=st.w*CELL;document.getElementById('hmm').value=st.h*CELL;
  ['set','edge','mat'].forEach(function(k){
    document.querySelectorAll('#'+k+'seg button').forEach(function(b){b.classList.toggle('on',b.dataset.v===String(st[k]))});
  });
  var q='w='+st.w+'&h='+st.h+'&set='+st.set+'&edge='+st.edge+'&mat='+st.mat;
  try{history.replaceState(null,'','#'+q)}catch(e){}
  render();
}
function bindNum(id,key,mm){
  document.getElementById(id).addEventListener('input',function(e){
    var v=mm?e.target.value/CELL:e.target.value;
    st[key]=clamp(v);sync();
  });
}
bindNum('w','w');bindNum('wr','w');bindNum('h','h');bindNum('hr','h');bindNum('wmm','w',true);bindNum('hmm','h',true);
function bindSeg(k,num){
  document.querySelectorAll('#'+k+'seg button').forEach(function(b){
    b.addEventListener('click',function(){st[k]=num?+b.dataset.v:b.dataset.v;sync();});
  });
}
bindSeg('set');bindSeg('edge',true);bindSeg('mat');

document.getElementById('copylink').addEventListener('click',function(){
  var btn=this,url=location.href;
  function done(){var t=btn.textContent;btn.textContent='Link copied';setTimeout(function(){btn.textContent=t},1500)}
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(done,function(){prompt('Copy this link:',url)});
  else prompt('Copy this link:',url);
});
document.getElementById('dl').addEventListener('click',function(){
  var P=window.__plan,L=[];
  L.push('Modular pegboard '+(st.w*CELL)+' x '+(st.h*CELL)+' mm ('+st.w+' x '+st.h+' cells), set '+st.set+', '+st.mat.toUpperCase());
  L.push('');
  P.rows.forEach(function(r){L.push('x'+r.qty+'  '+plainLabel(r.key)+'  -  '+fileName(r.f)+', plate '+r.p+(r.extra?'  ('+r.extra+')':''))});
  var blob=new Blob([L.join('\n')+'\n'],{type:'text/plain'}),a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download='pegboard_print_list_'+st.w+'x'+st.h+'.txt';a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href)},1000);
});

/* read state from URL hash */
(function(){
  var m=location.hash.replace(/^#/,'').split('&');
  m.forEach(function(kv){
    var p=kv.split('=');if(p.length!==2)return;
    if(p[0]==='w')st.w=clamp(p[1]);
    if(p[0]==='h')st.h=clamp(p[1]);
    if(p[0]==='set'&&/^(S|M|SM)$/.test(p[1]))st.set=p[1];
    if(p[0]==='edge')st.edge=p[1]==='0'?0:1;
    if(p[0]==='mat'&&/^(pla|petg)$/.test(p[1]))st.mat=p[1];
  });
})();
sync();
})();
</script>
